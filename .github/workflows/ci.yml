name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - '**/*.cs'
              - '**/*.csproj'
              - '**/*.xaml'
              - '**/*.props'
              - '**/*.targets'
              - '**/packages.lock.json'
              - 'TypingSound.slnx'
              - 'global.json'
              - 'NuGet.Config'
              - 'nuget.config'
              - '.editorconfig'
              - '.config/dotnet-tools.json'
              - 'justfile'
              - 'mise.toml'
              - 'mise.lock'
              - '.github/workflows/ci.yml'
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91 # v2
        with:
          version: "0.10.0"
      - run: taplo fmt --check
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require approval for release proposals
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')
          if echo "$labels" | grep -qx "autorelease: pending"; then
            if ! echo "$labels" | grep -qx "release: approved"; then
              echo "::error::Release proposals require the 'release: approved' label."
              exit 1
            fi
          fi
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:actions

  build-test:
    needs: checks
    if: github.event_name != 'pull_request' || needs.checks.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: csharp
          build-mode: manual
      - name: Verify formatting, build, audit, and coverage
        run: just verify
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:csharp

  required:
    if: always()
    needs: [checks, build-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful checks and the selected build
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '.checks.result == "success" and
            (.["build-test"].result == "success" or
              (.["build-test"].result == "skipped" and .checks.outputs.code == "false"))' <<< "$RESULTS"
