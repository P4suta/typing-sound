# CodeQL static analysis of the C# app and the workflows themselves. Two analyses:
# csharp (analyze) uses build-mode manual — `just build-all` with mise's pinned SDK builds
# with the same pins as CI (autobuild would also work); actions (analyze-actions) uses
# build-mode none on cheap ubuntu. The `analyze` job is a required status check (.github/rulesets/).
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

# Top level read-only; each job requests only the security-events: write it needs for
# SARIF upload (Scorecard's Token-Permissions scores per-job write).
permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned dotnet / just from mise.toml (exact match with local/CI).
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: csharp
          build-mode: manual

      - name: build for CodeQL
        run: just build-all

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:csharp"

  # Analyze the workflow YAML itself (GITHUB_TOKEN perms, untrusted-input, etc.).
  # build-mode none needs no toolchain, so run on cheap ubuntu.
  analyze-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:actions"
